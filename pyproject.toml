[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "python-chat-bot"
version = "0.1.0"
description = "A small FastAPI chatbot service backed by the Gemini Interactions API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.120,<1.0",
    "google-genai==2.29.0",
    "pydantic-settings>=2.7,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13,<3.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot_api"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
